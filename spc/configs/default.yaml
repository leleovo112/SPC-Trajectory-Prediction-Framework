# configs/default.yaml
# Default configuration for the SPC neuro-symbolic trajectory prediction framework.
# Values here mirror the defaults in config.py; use train.yaml / infer.yaml to override.

model:
  d_model:    256    # HIDDEN_DIM
  intent_dim: 128    # INTENT_DIM  (meta-action embedding dimension)
  n_actions:  12     # NUM_ACTIONS (3 lateral × 4 longitudinal)
  input_dim:  7      # agent state: [x, y, vx, vy, ax, ay, yaw]
  map_dim:    2      # map waypoint dimension

data:
  root:               /root/autodl-tmp/deepaccident/data
  processed_path:     /home/carla_user/processed/all_samples.pkl
  scaler_path:        /home/carla_user/processed/scalers.pkl
  map_max_lines:      50
  map_points_per_line: 20

train:
  batch_size:  16
  epochs:      20
  lr:          1.0e-4
  weight_decay: 0.01
  grad_clip:   1.0
  device:      cuda:0
  num_workers: 4
  seed:        42

llm:
  provider:    openai          # openai | deepseek | qwen | local
  model:       gpt-4-turbo
  temperature: 0.0
  max_tokens:  1024
  cache_dir:   /home/carla_user/llm_cache

loss_weights:
  reg:    1.0
  intent: 0.5
  phy:    0.1
  scene:  0.1

safety:
  max_acc:              8.0
  max_jerk:             20.0
  max_ang_vel:          0.6
  lane_width:           3.5
  scene_sample_points:  8

logging:
  save_ckpt_dir:   /home/carla_user/checkpoints
  output_dir:      /home/carla_user/results
  llm_cache_dir:   /home/carla_user/llm_cache
  use_tensorboard: false
  tensorboard_dir: /home/carla_user/runs

misc:
  seed: 42
  dt:   0.1
